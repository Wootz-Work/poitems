            };

            // Every stage is rebuilt, including completed ones — a stage that
            // already succeeded can still gain rows the user typed afterwards,
            // and those must go out. Rows already written are excluded by
            // physical row index, so they are never sent twice.
            ['childParts', 'boParts'].forEach(k => {
                const st = _submitState[k];
                if (!st) return;
                const alreadySent = new Set((st.sent || [])
                    .map(r => r._sentKey).filter(Boolean));
                const outstanding = (fresh[k].payload || []).filter(r => !alreadySent.has(r._sentKey));
                st.payload = remap(outstanding, st.payload);

                if (!st.payload.length) {
                    // Nothing left to send: completed if anything went out.
                    st.status = (st.sent || []).length ? 'done' : 'skipped';
                } else if (st.status === 'done' || st.status === 'skipped') {
                    st.status = 'todo';        // reopened by rows added since
                }
                // 'todo' | 'failed' | 'pending' already mean "runnable" — leave them.
            });

            const pdfs = _submitState.pdfs;
            if (pdfs && pdfs.status !== 'done') {
                const alreadyDone = new Set(pdfs.done || []);
                pdfs.remaining = (fresh.pdfs.remaining || []).filter(p => !alreadyDone.has(p));
                if (!pdfs.remaining.length) pdfs.status = 'skipped';
                else if (pdfs.status === 'skipped') pdfs.status = 'todo';
            }

            let mx = _submitState.itemBase || 0;
            ['childParts', 'boParts'].forEach(k => {
                (_submitState[k]?.sent || []).forEach(r => { mx = Math.max(mx, r.itemNumber); });
                (_submitState[k]?.payload || []).forEach(r => { mx = Math.max(mx, r.itemNumber); });
            });
            _submitState.maxItemNumber = mx;
        }

        function announceUnresolvedSubmit() {
            const done = [], outstanding = [];
            ['childParts', 'pdfs', 'boParts'].forEach(k => {
                const st = _submitState[k];
                if (!st || st.status === 'skipped') return;
                if (stageRowCount(k, 'sent') > 0) done.push(k);
                if (stageNeedsSending(st) && stageRowCount(k, 'todo') > 0) outstanding.push(k);
            });

            // A 'pending' stage means the request went out and no reply came
            // back — we genuinely cannot tell whether Glide stored it. Always
            // say so; the item counter only sharpens the warning.
            const pending = ['childParts', 'pdfs', 'boParts'].filter(k => _submitState[k]?.status === 'pending');
            const counterMoved = currentItemParam() >= (_submitState.maxItemNumber || 0);

            const line = (k, cls) => {
                const n = stageRowCount(k, cls === 'draft-stage-done' ? 'sent' : 'todo');
                const label = STAGE_LABELS[k];
                return `<div class="${cls}">• ${escapeHtml(label)}${n ? ` (${n})` : ''}</div>`;
            };

            let body = 'Your last submission did not finish.<br><br>';
            if (done.length) body += `<strong>Already saved to Glide:</strong>${done.map(k => line(k, 'draft-stage-done')).join('')}<br>`;
            if (outstanding.length) body += `<strong>Not yet saved:</strong>${outstanding.map(k => line(k, 'draft-stage-todo')).join('')}<br>`;
            if (pending.length) {
                body += `<strong>Outcome unknown:</strong> ${pending.map(k => escapeHtml(STAGE_LABELS[k])).join(', ')} ` +
                        `— the request was sent but no reply came back, so it may or may not have saved.` +
                        (counterMoved ? ` The item counter has moved, which suggests something did land.` : ``) +
                        ` <strong>Check Glide before sending again.</strong><br><br>`;
            }
            body += onlyPdfsOutstanding()
                ? `All BOM data is saved. Only the placeholder drawing is missing — review, then press <strong>Create drawing</strong>.`
                : `Review the table, then press <strong>Submit Remaining</strong>. Rows already saved are locked and will not be sent twice.`;

            openDraftModal('Unfinished submission', body, [
                { label: 'Got it', primary: true, onClick: () => {
                    showNotification(
                        onlyPdfsOutstanding()
                            ? 'All data saved. Placeholder drawing still to create.'
                            : `Already saved: ${done.map(k => STAGE_LABELS[k]).join(', ') || 'nothing'}. Press Submit Remaining when ready.`,
                        'warning', 0
                    );
                } }
            ]);
        }

        async function sendDataToBackend(opts = {}) {
            // Any Submit press while a submission is unresolved CONTINUES it.
            // Rebuilding here would re-send stages that already reached Glide.
            const resume = !!opts.resume || hasUnresolvedSubmit();
            const addDataBtn = document.getElementById("submit-btn");
            const originalText = addDataBtn.textContent;

            try {
                // Provide some visual feedback (you can customize as needed)
                addDataBtn.disabled = true;
                addDataBtn.textContent = "Sending...";

                {
                    // Resuming validates too — it can carry newly added or
                    // corrected rows, and previously skipped this entirely, so a
                    // duplicate or a bad quantity added after a partial failure
                    // went straight to Glide. Rows already sent are excluded
                    // from the field checks but still counted for duplicates.
                    const validation = resume
                        ? validateRequiredFields({ skipRows: _lockedRows, resume: true })
                        : validateRequiredFields();
                    if (!validation.isValid) {
                        showNotification(
                            `Missing Data:\n${validation.missingFields.join(
                                ", "
                            )}`, 'error'
                        );
                        addDataBtn.disabled = false;
                        addDataBtn.textContent = originalText;
                        return;
                    }
                }

                const urlParams = new URLSearchParams(window.location.search);
                const project = urlParams.get("project");
                const parentDrawingNumber = urlParams.get("parentdrgnum");
                const partNumber = urlParams.get("part");
                if (!project || !parentDrawingNumber || !partNumber) {
                    throw new Error("Missing required URL params");
                }

                if (resume && _submitState) {
                    const diverged = divergedLockedRows();
                    if (diverged.length) {
                        showNotification(
                            `Item ${diverged.join(', ')} already saved to Glide — edits made here won't update it. Correct it in Glide directly.`,
                            'warning', 0
                        );
                    }
                    // Pick up corrections and newly added rows for anything that
                    // has not already reached Glide.
                    rebuildOutstandingStages();
                    saveDraftNow();
                } else {
                    _submitState = buildSubmitState();
                    recomputeLockedRows();
                    saveDraftNow();
                }

                const childPartsPayload = _submitState.childParts.payload || [];
                const boPartsPayload = _submitState.boParts.payload || [];
                const maxItemNumber = _submitState.maxItemNumber;

                const pdfsOutstanding = stageNeedsSending(_submitState.pdfs)
                    && (_submitState.pdfs.remaining || []).length > 0;
                const anythingSent = ['childParts', 'boParts']
                    .some(k => (_submitState[k].sent || []).length > 0)
                    || (_submitState.pdfs.done || []).length > 0;
                if (!childPartsPayload.length && !boPartsPayload.length && !pdfsOutstanding && !anythingSent) {
                    throw new Error("No data was processed");
                }

                // Keep the legacy debug globals populated, matching what actually
                // goes over the wire (no internal _pRow marker).
                childPartsData.length = 0;
                boData.length = 0;
                stripInternal(childPartsPayload).forEach(r => childPartsData.push(r));
                stripInternal(boPartsPayload).forEach(r => boData.push(r));

                console.log("📊 Item Number Calculation:");
                console.log("  Base lastOcrBomItem:", _submitState.itemBase);
                console.log("  Calculated maxItemNumber:", maxItemNumber);
                console.log("  Total items:", childPartsPayload.length + boPartsPayload.length);

                // ── Stage 1: Child Parts ───────────────────────────────────
                // Skipped outright when a previous attempt already landed it —
                // this is what stops a retry duplicating rows in Glide.
                if (stageNeedsSending(_submitState.childParts)) {
                    _submitState.childParts.status = 'pending';
                    saveDraftNow();
                    let respChild;
                    try {
                        respChild = await fetch(
                              ENDPOINTS.addChildParts,
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    rows: stripInternal(childPartsPayload),
                                    project,
                                    parentDrawingNumber,
                                    partNumber,
                                    rowID: rowID,
                                    maxItemNumber: maxItemNumber
                                }),
                            }
                        );
                    } catch (netErr) {
                        // Left 'pending': the request may or may not have landed.
                        saveDraftNow();
                        throw new Error(`Failed to add Child Parts: ${netErr.message}`);
                    }
                    if (!respChild.ok) {
                        _submitState.childParts.status = 'failed';
                        saveDraftNow();
                        throw new Error(`Failed to add Child Parts: ${await respChild.text()}`);
                    }
                    markStageSent('childParts');
                    recomputeLockedRows();
                    saveDraftNow();
                    if (hot) hot.render();
                }

                // ── Stage 2: one placeholder PDF per missing drawing ────────
                // Tracked per part: each call also adds a row to the Drawing
                // table, so re-sending one already done would duplicate it.
                if (stageNeedsSending(_submitState.pdfs)) {
                    _submitState.pdfs.status = 'pending';
                    saveDraftNow();
                    const remaining = (_submitState.pdfs.remaining || []).slice();
                    console.log(`📄 Generating ${remaining.length} PDFs for missing childparts`);

                    const results = await Promise.all(remaining.map(async (matchedPart) => {
                        try {
                            const pdfUrl =
                                `${ENDPOINTS.generateMissingChildpartPdf}` +
                                `?project=${encodeURIComponent(project)}` +
                                `&part=${encodeURIComponent(partNumber)}`;

                            const pdfResp = await fetch(pdfUrl, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ matchedPart: matchedPart }),
                            });

                            if (pdfResp.ok) {
                                console.log(`✅ Missing childpart PDF generated successfully for: ${matchedPart}`);
                                return { matchedPart, ok: true };
                            }
                            console.warn(`⚠️ PDF generation failed for ${matchedPart}:`, await pdfResp.text());
                            return { matchedPart, ok: false };
                        } catch (pdfError) {
                            console.error(`❌ PDF generation error for ${matchedPart}:`, pdfError);
                            return { matchedPart, ok: false };
                        }
                    }));

                    results.filter(r => r.ok).forEach(r => {
                        _submitState.pdfs.done.push(r.matchedPart);
                        _submitState.pdfs.remaining = _submitState.pdfs.remaining.filter(p => p !== r.matchedPart);
                    });
                    const failedPdfs = results.filter(r => !r.ok).map(r => r.matchedPart);
                    _submitState.pdfs.status = failedPdfs.length ? 'failed' : 'done';
                    saveDraftNow();

                    // Previously these failures were only logged, which silently
                    // defeated the point of the placeholder.
                    if (failedPdfs.length) {
                        throw new Error(`Could not create placeholder drawing for: ${failedPdfs.join(', ')}`);
                    }
                }

                // ── Stage 3: BO Parts ──────────────────────────────────────
                if (stageNeedsSending(_submitState.boParts)) {
                    _submitState.boParts.status = 'pending';
                    saveDraftNow();
                    let respBo;
                    try {
                        respBo = await fetch(
                                ENDPOINTS.addBoParts,
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    rows: stripInternal(boPartsPayload),
                                    project,
                                    parentDrawingNumber,
                                    partNumber,
                                    rowID: rowID,
                                    maxItemNumber: maxItemNumber
                                }),
                            }
                        );
                    } catch (netErr) {
                        saveDraftNow();
                        throw new Error(`Failed to add BO Parts: ${netErr.message}`);
                    }
                    if (!respBo.ok) {
                        _submitState.boParts.status = 'failed';
                        saveDraftNow();
                        throw new Error(`Failed to add BO Parts: ${await respBo.text()}`);
                    }
                    markStageSent('boParts');
                    recomputeLockedRows();
                    saveDraftNow();
                    if (hot) hot.render();
                }

                clearNotificationActions();
                // force: a warning from the unfinished-submission modal is sticky
                // and outranks a success, so without this a completed Submit
                // Remaining showed no confirmation and left the stale warning up.
                showNotification(
                    `Data added successfully!\n- Child Parts: ${childPartsPayload.length}\n- BO Parts: ${boPartsPayload.length}`,
                    'success', 5000, { force: true }
                );
                // Unlock first: hot.clear() will not touch readOnly cells, so
                // clearing while rows are still locked would leave data behind.
                _lockedRows = new Set();
                if (hot) hot.render();
                // Order matters: clearTableToDefault() fires afterChange, which
                // schedules a save; clearDraft() then cancels that pending timer.
                clearTableToDefault();
                clearDraft();          // whole submission landed — drop the draft
            } catch (error) {
                console.error("Error sending data:", error);
                clearNotificationActions();
                const done = [];
                if (_submitState?.childParts?.status === 'done') done.push('Child Parts');
                if (_submitState?.pdfs?.status === 'done') done.push('Missing-drawing PDFs');
                if (_submitState?.boParts?.status === 'done') done.push('BO Parts');
                // error.message can carry the entire server response body, or a
                // whole source snippet for a TypeError. The bar is one line —
                // keep it short and put the full detail in the console above.
                const raw = String(error.message || 'Unknown error');
                const brief = raw.length > 110 ? raw.slice(0, 110).trimEnd() + '…' : raw;
                showNotification(
                    `${brief}` +
                    (done.length ? `\nAlready saved (not resent): ${done.join(', ')}.` : '') +
                    `\nSee the browser console for details.`,
                    'error'
                );
                saveDraftNow();
            } finally {
                addDataBtn.disabled = false;
                // Label states what the NEXT press will do, so there is never a
                // second competing action anywhere in the UI.
                refreshSubmitButtonState();
            }
        }

        // --- Ensure OCR upload header areas use correct data-column attributes (internal keys) ---
        // This runs once on DOMContentLoaded to fix any "data-column" attributes for header upload areas
        // ========== APPEND MODE TOGGLE ==========
        document.getElementById("append-mode-btn").addEventListener("click", () => {
            const btn = document.getElementById("append-mode-btn");
            isAppendMode = !isAppendMode;
            
            if (isAppendMode) {
                btn.classList.remove("append-mode-off");
                btn.classList.add("append-mode-on");
                console.log("✅ Append mode: ENABLED");
                showNotification("Append Mode ON", 'success', 1000);
            } else {
                btn.classList.remove("append-mode-on");
                btn.classList.add("append-mode-off");
                console.log("❌ Append mode: DISABLED");
                showNotification("Append Mode OFF", 'success', 1000);
            }
        });
        document.addEventListener("DOMContentLoaded", function () {
            // Map display titles to internal keys
            const columnKeyMap = {
                "Part Number": "PartNumber",
                "Quantity": "Quantity",
                "Description": "Description",
                "Material": "Material",
            };
            // Find all .ocr-upload-area in the header-row and update data-column
            document.querySelectorAll(".header-row .ocr-upload-area").forEach(area => {
                const oldCol = area.getAttribute("data-column");
                if (columnKeyMap[oldCol]) {
                    area.setAttribute("data-column", columnKeyMap[oldCol]);
                }
            });
            // Add a marker class for header upload areas (so afterGetColHeader can find them)
            document.querySelectorAll(".header-row .ocr-upload-area").forEach(area => {
                area.classList.add("ocr-upload-area-header");
            });
        });
        lucide.createIcons();

    </script>
<!-- Default content template (easy to replace later) -->
<template id="instr-modal-default">
  <figure style="margin:0">
    <img src="sample-screenshot.png" alt="Good vs Bad screenshot guide" />
    <!-- You can add captions, bullets, or more elements here later -->
    <!-- <figcaption style="color:#aaa;margin-top:8px">Tips for best results...</figcaption> -->
  </figure>
</template>

<!-- Reusable modal with a content slot -->
<div id="instr-modal-backdrop">
  <div id="instr-modal-card" role="dialog" aria-modal="true" aria-labelledby="instr-modal-title">
    <button id="instr-modal-close" aria-label="Close">×</button>
    <div id="instr-modal-body"></div>
  </div>
</div>

     reusing the instructions modal, which carries hover and auto-close timers. -->
<div id="draft-modal-backdrop" aria-hidden="true">
  <div id="draft-modal-card" role="dialog" aria-modal="true" aria-labelledby="draft-modal-title" tabindex="-1">
    <h3 id="draft-modal-title"></h3>
    <div id="draft-modal-body"></div>
    <div id="draft-modal-actions"></div>
  </div>
</div>
