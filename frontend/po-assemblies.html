<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add assemblies</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg: #0f0f10;
            --panel: #18181b;
            --panel-2: #1d1d21;
            --field: #1f1f23;
            --menu: #232327;
            --line: #2c2c31;
            --line-strong: #34343a;
            --text: #ededef;
            --text-2: #d4d4d8;
            --muted: #a1a1aa;
            --faint: #85858e;
            --icon: #6b6b74;
            --primary: #d99e02;
            --primary-text: #1a1405;
            --primary-soft: #e8b737;
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, .08);
            --ok: #4ade80;
            --hover: #2c2c31;
            --viewer: #0b0b0c;
            --shadow: 0 18px 44px rgba(0, 0, 0, .6);
            --tint-alpha: .055;
            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f6f8;
                --panel: #ffffff;
                --panel-2: #f7f7f9;
                --field: #ffffff;
                --menu: #ffffff;
                --line: #e7e7ea;
                --line-strong: #dcdce0;
                --text: #18181b;
                --text-2: #3f3f46;
                --muted: #5f5f68;
                --faint: #71717a;
                --icon: #8a8a93;
                --primary-soft: #a87700;
                --danger: #c62828;
                --danger-soft: rgba(220, 38, 38, .06);
                --ok: #16a34a;
                --hover: #f0f0f3;
                --viewer: #e9ebef;
                --shadow: 0 16px 40px rgba(24, 24, 27, .16);
                --tint-alpha: .08;
                color-scheme: light;
            }
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            display: flex;
            flex-direction: column;
        }

        button, input, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; }
        a { color: var(--primary-soft); }

        /* ---------- Header ---------- */
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--line);
        }
        .title { flex: 1 1 300px; min-width: 0; }
        h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
        .subtitle { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
        .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .missing {
            border: none; background: none; padding: 0 6px; height: 40px;
            font-size: 13px; color: var(--danger);
        }
        .missing:hover { text-decoration: underline; }
        .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
        .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
        .status.saved .dot { background: var(--ok); }
        .status.saving .dot { background: var(--primary); }
        .status.error { color: var(--danger); }
        .status.error .dot { background: var(--danger); }
        .btn-tertiary { height: 40px; padding: 0 12px; border: none; background: transparent; color: var(--text-2); border-radius: 8px; }
        .btn-tertiary:hover:not(:disabled) { background: var(--hover); }
        .btn-primary {
            height: 40px; padding: 0 18px; border: none; border-radius: 8px;
            background: var(--primary); color: var(--primary-text); font-weight: 600;
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
        .btn-primary:disabled { opacity: .45; }
        .btn-outline {
            height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--line-strong); background: transparent; border-radius: 8px;
        }
        .btn-outline:hover:not(:disabled) { background: var(--hover); }

        /* ---------- Layout ---------- */
        main {
            flex: 1;
            min-height: 0;
            display: flex;
            padding: 16px 24px 24px;
        }
        .splitter { flex: none; width: 16px; cursor: col-resize; position: relative; touch-action: none; }
        .splitter::after {
            content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 40px; border-radius: 2px;
            transform: translate(-50%, -50%); background: var(--line-strong); transition: background .15s, height .15s;
        }
        .splitter:hover::after, .splitter:focus-visible::after, body.resizing .splitter::after { background: var(--primary); height: 64px; }
        .splitter:focus-visible { outline: none; }
        body.resizing { cursor: col-resize; user-select: none; }
        body.resizing iframe { pointer-events: none; }
        .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
        .doc { flex: 4 1 0; display: flex; flex-direction: column; }
        .items { flex: 6 1 0; display: flex; flex-direction: column; }

        @media (max-width: 1000px) {
            body { height: auto; }
            main { flex-direction: column; gap: 16px; }
            .splitter { display: none; }
            .doc { flex: none; height: 60vh; }
            .items { flex: none; }
        }

        /* ---------- Document viewer ---------- */
        .doc-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
        .tab { height: 32px; padding: 0 12px; border: none; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; }
        .tab:hover { color: var(--text); }
        .tab.active { background: var(--hover); color: var(--text); }
        .doc-open { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 0 8px; font-size: 13px; text-decoration: none; }
        .viewer { flex: 1; min-height: 0; background: var(--viewer); position: relative; }
        .viewer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
        .viewer .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
        .doc-tools { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; }
        .doc-tools button { height: 30px; min-width: 30px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; }
        .doc-tools button:hover { background: var(--hover); color: var(--text); }
        .doc-tools .pct { min-width: 52px; font-variant-numeric: tabular-nums; }
        .doc-tools + .doc-open { margin-left: 0; }
        .pdf-scroll { position: absolute; inset: 0; overflow: auto; touch-action: pan-x pan-y; }
        .pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; width: max-content; min-width: 100%; }
        .pdf-page { position: relative; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .3); }
        .pdf-page canvas { display: block; }
        .pdf-page img { display: block; }
        /* pdf.js text layer: invisible text over the page, so it can be selected and copied */
        .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-align: initial; opacity: 1; forced-color-adjust: none; transform-origin: 0 0; z-index: 2; }
        .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
        .textLayer ::selection { background: rgba(217, 158, 2, .35); }
        .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
        .doc-note { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 6px 10px; border-radius: 8px; background: var(--menu); color: var(--muted); font-size: 12px; text-align: center; z-index: 3; }

        /* ---------- Table ---------- */
        .table-scroll { flex: 1; min-height: 0; overflow: auto; }
        .table { min-width: 1180px; }
        .grid {
            display: grid;
            grid-template-columns: 40px minmax(150px, 1.1fr) minmax(140px, 1fr) minmax(170px, 1.5fr) 84px minmax(140px, 1fr) 128px 140px 140px 44px;
            align-items: stretch;
        }
        .section-head {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            min-height: 56px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line);
        }
        .section-head .name { font-weight: 600; }
        .section-head .count { font-size: 13px; color: var(--muted); }
        .section-head .note { font-size: 12px; color: var(--faint); }
        .section-head .spacer { flex: 1; }
        .existing-head { padding-top: 22px; }
        .colhead {
            position: sticky; top: 0; z-index: 2;
            background: var(--panel-2); border-bottom: 1px solid var(--line-strong);
            font-size: 12px; font-weight: 500; color: var(--muted);
        }
        .colhead > span { display: flex; flex-direction: column; justify-content: center; padding: 8px 12px; border-right: 1px solid var(--line); }
        .colhead > span:last-child { border-right: none; }
        .colhead small { font-size: 11px; font-weight: 400; color: var(--faint); }
        .colhead .num { align-items: flex-end; }

        .row { min-height: 52px; border-bottom: 1px solid var(--line); }
        .row > .cell { display: flex; align-items: center; border-right: 1px solid var(--line); min-width: 0; }
        .row > .cell:last-child { border-right: none; }
        .cell.center { justify-content: center; }
        .cell.pad { padding: 6px 8px; }
        .cell.text { padding: 8px 12px; }
        .cell.muted { color: var(--muted); }
        .cell.mono, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
        .row.removed { opacity: .5; }
        .row.removed .strike { text-decoration: line-through; }
        /* Selection is shown on the checkbox cell only, so a group's row tint stays visible */
        .row.selected > .cell:first-child { background: color-mix(in srgb, var(--primary) 22%, transparent); box-shadow: inset 3px 0 0 var(--primary); }

        input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; margin: 0; }

        .in {
            width: 100%; height: 100%; min-height: 50px; border: none; outline: none; background: transparent;
            padding: 8px 12px; resize: none; line-height: 1.35;
        }
        .in:focus { box-shadow: inset 0 0 0 2px var(--primary); }
        textarea.in { display: block; overflow: hidden; padding-top: 15px; color: var(--text-2); }
        .in.num { text-align: right; font-variant-numeric: tabular-nums; }
        .in.date { font-size: 13px; padding: 8px 10px; }
        .in.date::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
        .dates-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
        .dates-bar label { display: inline-flex; align-items: center; gap: 8px; }
        .dates-bar input { height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--field); font-size: 13px; }
        .cell.invalid { background: var(--danger-soft); }
        .cell.invalid .in::placeholder { color: var(--danger); opacity: 1; }
        .qty-wrap { display: flex; flex-direction: column; align-items: stretch; width: 100%; height: 100%; }
        .qty-wrap .in { min-height: 0; flex: 1; }
        .was { font-size: 11px; color: var(--faint); text-align: right; padding: 0 12px 6px; margin-top: -8px; }

        .select {
            width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
            border: 1px solid var(--line-strong); background: var(--field); border-radius: 7px; text-align: left; min-width: 0;
        }
        .select:hover:not(:disabled) { border-color: var(--icon); }
        .select[aria-expanded="true"] { border-color: var(--icon); }
        .select .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .select.placeholder { color: var(--muted); }
        .select.invalid { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
        .select:disabled { background: transparent; border-color: transparent; color: var(--muted); padding-left: 4px; }
        .select:disabled .chev { display: none !important; }
        .dot-g { width: 8px; height: 8px; border-radius: 50%; flex: none; }

        .icon-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--icon); border-radius: 6px; }
        .icon-btn:hover { background: var(--hover); color: var(--text); }
        .undo { height: 28px; padding: 0 6px; border: none; background: transparent; color: var(--primary-soft); font-size: 12px; border-radius: 6px; }

        .bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .bulk .sep { width: 1px; height: 20px; background: var(--line-strong); }
        .bulk .danger { color: var(--danger); }

        .add-row-line { padding: 8px 12px; border-bottom: 1px solid var(--line); }
        .add-row-line button { height: 32px; border: none; background: none; color: var(--muted); padding: 0 6px; border-radius: 6px; }
        .add-row-line button:hover { color: var(--text); background: var(--hover); }
        .footer { padding: 14px 16px; border-top: 1px solid var(--line-strong); font-size: 13px; color: var(--muted); }
        .empty-note { padding: 18px 16px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }

        /* ---------- Menus, dialogs, toasts ---------- */
        .menu {
            position: fixed; z-index: 100; min-width: 220px; max-width: 320px; max-height: 360px; overflow: auto;
            background: var(--menu); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
        }
        .menu[hidden] { display: none; }
        .menu .opt {
            width: 100%; min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
            border: none; border-radius: 8px; background: transparent; text-align: left;
        }
        .menu .opt:hover, .menu .opt:focus-visible { background: var(--hover); outline: none; }
        .menu .opt .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .menu .opt .meta { font-size: 12px; color: var(--faint); }
        .menu .opt .check { width: 15px; flex: none; }
        .menu .divider { height: 1px; background: var(--line-strong); margin: 4px; }
        .menu .heading { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
        .menu .create { display: flex; gap: 6px; padding: 4px; }
        .menu .create input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--field); outline: none; }
        .menu .create input:focus { border-color: var(--primary); }
        .menu .create button { height: 36px; padding: 0 12px; border: none; border-radius: 8px; background: var(--primary); color: var(--primary-text); font-weight: 600; }

        .backdrop { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .5); }
        .backdrop.show { display: flex; }
        .dialog { width: 100%; max-width: 440px; background: var(--menu); border: 1px solid var(--line-strong); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
        .dialog h2 { margin: 0 0 10px; font-size: 16px; }
        .dialog ul { margin: 0 0 12px; padding-left: 18px; color: var(--text-2); }
        .dialog p { margin: 0; color: var(--muted); font-size: 13px; }
        .dialog .row-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

        .toast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300;
            display: none; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
            padding: 10px 12px 10px 16px; border-radius: 10px; background: var(--menu); border: 1px solid var(--line-strong);
            box-shadow: var(--shadow); white-space: pre-line;
        }
        .toast.show { display: flex; }
        .toast.error { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
        .toast button { border: none; background: none; color: var(--primary-soft); font-weight: 600; padding: 4px 6px; }

        .loading { padding: 40px; text-align: center; color: var(--muted); }
    </style>
</head>

<body>
    <header>
        <div class="title">
            <h1>Add assemblies</h1>
            <p class="subtitle">Drawings can be uploaded after submission from the assembly page.</p>
        </div>
        <div class="actions">
            <button class="missing" id="missing" hidden></button>
            <span class="status" id="status"><span class="dot"></span><span id="status-text">Loading…</span></span>
            <button class="btn-tertiary" id="save" disabled>Save changes</button>
            <button class="btn-primary" id="publish" disabled>Publish to manufacturing</button>
        </div>
    </header>

    <main>
        <section class="pane doc" aria-label="PO documents">
            <div class="doc-tabs" id="doc-tabs"></div>
            <div class="viewer" id="viewer"><div class="empty">Loading…</div></div>
        </section>
        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the document and table" tabindex="0"></div>
        <section class="pane items" aria-label="Assemblies">
            <div class="table-scroll" id="table-scroll">
                <div class="loading" id="loading">Loading line items…</div>
                <div class="table" id="table" hidden></div>
            </div>
        </section>
    </main>

    <div class="menu" id="menu" role="menu" hidden></div>

    <div class="backdrop" id="confirm">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h2 id="confirm-title">Publish to manufacturing?</h2>
            <ul id="confirm-list"></ul>
            <p>The PO will be marked as accepted. Drawings can be uploaded afterwards from the assembly page.</p>
            <div class="row-actions">
                <button class="btn-tertiary" id="confirm-cancel">Cancel</button>
                <button class="btn-primary" id="confirm-ok">Publish</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-action" hidden></button></div>

    <script>
        const params = new URLSearchParams(location.search);
        const PO_ROW_ID = params.get("po") || params.get("poRowID") || params.get("rowID");
        // Email of the signed-in Glide user, recorded as "PO Approved By" and CC'd on the email
        const USER_EMAIL = params.get("user") || params.get("email") || "";
        // The PO Assemblies Render service (backend/po_app.py); ?api= overrides it for testing
        const API_BASE = (params.get("api") || "https://po-assemblies.onrender.com").replace(/\/$/, "");
        const API = `${API_BASE}/po-assemblies/${encodeURIComponent(PO_ROW_ID || "")}`;
        const EDITS_KEY = `po-assemblies:${PO_ROW_ID}:existing-edits`;

        const SAVE_DELAY_MS = 700;
        const SAVED_FIELDS = ["partNumber", "partName", "quantity", "partOfGroup", "groupName", "project", "rejected", "groupMaster",
            "currentStatus", "mfgStartDate", "dispatchDate"];
        // Fields a new row sends with its first save, besides the one being typed
        const NEW_ROW_FIELDS = ["project", "partOfGroup", "groupName", "currentStatus", "mfgStartDate", "dispatchDate"];
        const GROUP_COLORS = ["#5fb3a6", "#9a8bd6", "#d0927c", "#7fa6d9", "#c2a55e", "#8dbb7c", "#c98bb3", "#6fb7c9"];

        let rows = [];             // line-item records shown on the page
        let groups = [];           // { name, partNumber, existing, project }
        let projects = [];
        let statuses = ["Mfg", "Sampling"];
        // Mfg start date defaults to tomorrow (local date)
        function tomorrow() {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }
        // Last values set with "Set for all", used for rows added afterwards
        const defaultDates = { mfgStartDate: tomorrow(), dispatchDate: "" };
        let existing = [];         // assemblies already in the PO's projects
        let existingEdits = {};    // key -> { quantity?, partName?, remove? }, kept in the browser until publish
        const records = new Map(); // localId -> record (rows, removed rows and new group masters still to save)
        const selected = new Set();
        let nextLocalId = 1;
        let busy = false;

        const $ = (id) => document.getElementById(id);
        const lower = (s) => (s || "").trim().toLowerCase();
        const partKey = (project, part) => `${lower(project)}|${lower(part)}`;

        function h(tag, attrs, ...children) {
            const el = document.createElement(tag);
            for (const [k, v] of Object.entries(attrs || {})) {
                if (v == null || v === false) continue;
                if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
                else if (k === "class") el.className = v;
                else if (k === "value") el.value = v;
                else if (k === "style") el.style.cssText = v;
                else if (k in el && typeof v !== "string") el[k] = v;
                else el.setAttribute(k, v === true ? "" : v);
            }
            for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
            return el;
        }

        const ICONS = {
            chevron: '<path d="m6 9 6 6 6-6"/>',
            trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
            plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
            check: '<path d="M20 6 9 17l-5-5"/>',
            external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
        };
        function icon(name, size = 14, cls = "") {
            const span = document.createElement("span");
            span.className = cls;
            span.style.display = "inline-flex";
            span.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
            return span;
        }

        // ---------- Records ----------

        function register(rec) {
            if (!rec._localId) rec._localId = `tmp_${nextLocalId++}`;
            if (!rec._dirty) rec._dirty = new Set();
            records.set(rec._localId, rec);
            return rec;
        }

        function newRecord() {
            return register({
                rowId: null, partNumber: "", partName: "", quantity: null,
                partOfGroup: false, groupName: "", project: projects.length === 1 ? projects[0] : "",
                currentStatus: statuses[0], ...defaultDates,
            });
        }

        function isBlank(rec) {
            return !rec.partNumber && !rec.partName && rec.quantity == null;
        }

        function markDirty(rec, keys) {
            keys.forEach((k) => rec._dirty.add(k));
            scheduleSave();
        }

        const existingByPart = () => new Map(existing.map((e) => [partKey(e.project, e.partNumber), e]));
        let existingIndex = new Map();
        const matchOf = (rec) => (rec.project && rec.partNumber ? existingIndex.get(partKey(rec.project, rec.partNumber)) : null);

        function findGroup(name) {
            return groups.find((g) => lower(g.name) === lower(name));
        }

        function groupColor(name) {
            const index = groups.findIndex((g) => lower(g.name) === lower(name));
            return GROUP_COLORS[(index < 0 ? 0 : index) % GROUP_COLORS.length];
        }

        function tint(color) {
            const alpha = getComputedStyle(document.documentElement).getPropertyValue("--tint-alpha").trim() || ".055";
            const n = parseInt(color.slice(1), 16);
            return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
        }

        function createGroup(name) {
            const found = findGroup(name);
            if (found) return found.name;
            groups.push({ name, partNumber: name, existing: false, project: "" });
            // New groups get a master row like the extractor's, so they come back as options on reload
            const master = register({
                rowId: null, partNumber: name, partName: name, quantity: 1,
                partOfGroup: false, groupName: name, groupMaster: true, project: "",
            });
            markDirty(master, ["partNumber", "partName", "quantity", "partOfGroup", "groupName", "groupMaster"]);
            return name;
        }

        function setParent(rec, name) {
            name = (name || "").trim();
            if (!name) {
                rec.partOfGroup = false;
                rec.groupName = "";
            } else {
                rec.partOfGroup = true;
                rec.groupName = createGroup(name);
            }
            markDirty(rec, ["partOfGroup", "groupName"]);
        }

        // ---------- Existing-assembly edits (kept in this browser until publish) ----------

        function loadEdits() {
            try { existingEdits = JSON.parse(localStorage.getItem(EDITS_KEY) || "{}") || {}; } catch { existingEdits = {}; }
        }

        function storeEdits() {
            try { localStorage.setItem(EDITS_KEY, JSON.stringify(existingEdits)); } catch { /* storage unavailable */ }
        }

        function editExisting(key, change) {
            const item = existing.find((e) => e.key === key);
            const next = { ...(existingEdits[key] || {}), ...change };
            if (next.quantity != null && item && Number(next.quantity) === item.quantity) delete next.quantity;
            if (next.partName != null && item && next.partName.trim() === item.partName) delete next.partName;
            if (!next.remove) delete next.remove;
            if (Object.keys(next).length) existingEdits[key] = next; else delete existingEdits[key];
            storeEdits();
        }

        // ---------- Saving ----------

        let saveTimer = null;
        let saving = null;
        let retryDelay = 2000;

        function setStatus(state, text) {
            $("status").className = `status ${state}`;
            $("status-text").textContent = text;
        }

        function hasDirty() {
            for (const rec of records.values()) {
                if (rec._dirty.size && !rec._creating && !(isBlank(rec) && !rec.groupMaster && !rec.rejected)) return true;
            }
            return false;
        }

        function scheduleSave(delay = SAVE_DELAY_MS) {
            setStatus("saving", "Saving…");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(flush, delay);
        }

        async function flush() {
            clearTimeout(saveTimer);
            if (saving) return saving.then(() => (hasDirty() ? flush() : undefined));

            const updates = [], creates = [], sent = [];
            for (const rec of records.values()) {
                if (!rec._dirty.size || rec._creating) continue;
                if (!rec.rowId) {
                    if (rec.rejected) { records.delete(rec._localId); continue; } // removed before it was ever saved
                    if (isBlank(rec) && !rec.groupMaster) continue;
                    const fields = {};
                    SAVED_FIELDS.forEach((k) => { if (rec[k] !== undefined && rec[k] !== "" && rec[k] !== null) fields[k] = rec[k]; });
                    creates.push({ tempId: rec._localId, fields });
                    rec._creating = true;
                } else {
                    const fields = {};
                    rec._dirty.forEach((k) => { fields[k] = rec[k] === undefined ? null : rec[k]; });
                    updates.push({ rowId: rec.rowId, fields });
                }
                sent.push([rec, new Set(rec._dirty)]);
                rec._dirty.clear();
            }
            if (!sent.length) {
                if (!hasDirty()) setStatus("saved", "Saved");
                return;
            }

            saving = (async () => {
                try {
                    const res = await fetch(`${API}/save`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ updates, creates }),
                        keepalive: true,
                    });
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
                    for (const [rec] of sent) {
                        if (rec._creating) {
                            rec.rowId = body.created?.[rec._localId] || rec.rowId;
                            rec._creating = false;
                        }
                    }
                    retryDelay = 2000;
                    return true;
                } catch (err) {
                    console.error("Save failed", err);
                    for (const [rec, keys] of sent) {
                        keys.forEach((k) => rec._dirty.add(k));
                        rec._creating = false;
                    }
                    setStatus("error", "Not saved – retrying");
                    saveTimer = setTimeout(flush, retryDelay);
                    retryDelay = Math.min(retryDelay * 2, 30000);
                    return false;
                } finally {
                    saving = null;
                }
            })();

            const ok = await saving;
            if (!ok) return;
            if (hasDirty()) return flush();
            setStatus("saved", "Saved");
        }

        async function flushAll() {
            for (let i = 0; i < 20; i++) {
                await flush();
                const pending = hasDirty() || saving || [...records.values()].some((r) => r._creating);
                if (!pending) return true;
                if ($("status").classList.contains("error")) return false;
                await new Promise((r) => setTimeout(r, 300));
            }
            return !hasDirty();
        }

        document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
        window.addEventListener("pagehide", () => flush());
        window.addEventListener("beforeunload", (e) => {
            if (hasDirty() || saving) { flush(); e.preventDefault(); e.returnValue = ""; }
        });

        // ---------- Validation and summary ----------

        function newRows() { return rows.filter((r) => !matchOf(r)); }
        function matchedRows() { return rows.filter((r) => matchOf(r)); }

        function rowProblems(rec) {
            const problems = {};
            if (matchOf(rec)) {
                if (!(rec.quantity > 0)) problems.quantity = true;
                return problems;
            }
            if (isBlank(rec)) return problems;
            if (!rec.partNumber) problems.partNumber = true;
            if (!(rec.quantity > 0)) problems.quantity = true;
            if (!rec.project) problems.project = true;
            if (!rec.mfgStartDate) problems.mfgStartDate = true;
            if (!rec.dispatchDate) problems.dispatchDate = true;
            return problems;
        }

        function existingProblems(item) {
            const edit = existingEdits[item.key];
            return edit && edit.quantity != null && !(Number(edit.quantity) > 0) ? { quantity: true } : {};
        }

        function summary() {
            const add = newRows().filter((r) => !isBlank(r));
            const updates = matchedRows().filter((r) => r.quantity !== matchOf(r).quantity).length +
                Object.values(existingEdits).filter((e) => !e.remove && e.quantity != null).length;
            const removals = Object.values(existingEdits).filter((e) => e.remove).length;
            const renames = Object.values(existingEdits).filter((e) => !e.remove && e.partName != null && e.quantity == null).length;
            const matched = matchedRows().length;
            const missing = rows.reduce((n, r) => n + Object.keys(rowProblems(r)).length, 0) +
                existing.reduce((n, e) => n + Object.keys(existingProblems(e)).length, 0);
            return { add: add.length, updates, removals, renames, matched, missing, work: add.length + matched + Object.keys(existingEdits).length };
        }

        function refreshChrome() {
            const s = summary();
            const missing = $("missing");
            missing.hidden = !s.missing;
            missing.textContent = `${s.missing} required field${s.missing === 1 ? "" : "s"} missing`;
            $("publish").disabled = busy || s.missing > 0 || s.work === 0;
            $("save").disabled = busy;
            const footer = $("footer");
            if (footer) {
                const parts = [];
                if (s.add) parts.push(`${s.add} new`);
                if (s.updates) parts.push(`${s.updates} quantity update${s.updates === 1 ? "" : "s"}`);
                if (s.renames) parts.push(`${s.renames} rename${s.renames === 1 ? "" : "s"}`);
                if (s.removals) parts.push(`${s.removals} removal${s.removals === 1 ? "" : "s"}`);
                footer.textContent = parts.length ? `On publish: ${parts.join(" · ")}` : "Nothing to publish yet";
            }
            document.querySelectorAll("[data-check]").forEach((cell) => {
                const [kind, id, field] = cell.dataset.check.split("|");
                const problems = kind === "row" ? rowProblems(records.get(id) || {}) : existingProblems(existing.find((e) => e.key === id) || {});
                cell.classList.toggle("invalid", !!problems[field]);
                const select = cell.querySelector(".select");
                if (select && field === "project") select.classList.toggle("invalid", !!problems[field]);
            });
        }

        // ---------- Rendering ----------

        function render() {
            existingIndex = existingByPart();
            const focus = document.activeElement?.dataset?.focus;
            const caret = document.activeElement?.selectionStart;
            const table = $("table");
            table.replaceChildren(renderNewSection(), ...renderExistingSections(), h("div", { class: "footer", id: "footer" }));
            if (focus) {
                const el = table.querySelector(`[data-focus="${CSS.escape(focus)}"]`);
                if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch { } }
            }
            table.querySelectorAll("textarea.in").forEach(autoGrow);
            refreshChrome();
        }

        function columnHeader(withSelectAll) {
            const list = newRows();
            const all = withSelectAll && list.length > 0 && list.every((r) => selected.has(r._localId));
            return h("div", { class: "grid colhead" },
                h("span", { style: "align-items:center" }, withSelectAll ? h("input", {
                    type: "checkbox", "aria-label": "Select all rows", checked: all,
                    onchange: (e) => { list.forEach((r) => e.target.checked ? selected.add(r._localId) : selected.delete(r._localId)); render(); },
                }) : ""),
                h("span", {}, "Parent assembly", h("small", {}, "Assembly becomes its child")),
                h("span", {}, withSelectAll ? "Assembly number *" : "Assembly number"),
                h("span", {}, "Assembly name"),
                h("span", { class: "num" }, "Qty *"),
                h("span", {}, withSelectAll ? "Project *" : "Project"),
                h("span", {}, "Status"),
                h("span", {}, withSelectAll ? "Mfg start date *" : "Mfg start date"),
                h("span", {}, withSelectAll ? "Dispatch date *" : "Dispatch date"),
                h("span", {}),
            );
        }

        function renderNewSection() {
            const list = newRows();
            const head = h("div", { class: "section-head" });
            if (selected.size) {
                head.append(h("div", { class: "bulk" },
                    h("span", { class: "name" }, `${selected.size} selected`),
                    h("span", { class: "sep" }),
                    h("button", { class: "btn-outline", onclick: (e) => openParentMenu(e.currentTarget, [...selected].map((id) => records.get(id))) }, "Set parent", icon("chevron")),
                    h("button", { class: "btn-outline", onclick: (e) => openProjectMenu(e.currentTarget, [...selected].map((id) => records.get(id))) }, "Set project", icon("chevron")),
                    h("button", { class: "btn-outline", onclick: (e) => openStatusMenu(e.currentTarget, [...selected].map((id) => records.get(id))) }, "Set status", icon("chevron")),
                    h("button", { class: "btn-tertiary danger", style: "height:32px", onclick: () => removeRows([...selected].map((id) => records.get(id))) }, "Remove"),
                ), h("span", { class: "spacer" }),
                    h("button", { class: "btn-tertiary", style: "height:32px", onclick: () => { selected.clear(); render(); } }, "Clear selection"));
            } else {
                head.append(
                    h("span", { class: "name" }, "New assemblies"),
                    h("span", { class: "count" }, String(list.filter((r) => !isBlank(r)).length)),
                    h("span", { class: "spacer" }),
                    h("button", { class: "btn-outline", onclick: addRow }, icon("plus"), "Add row"),
                );
            }
            const targets = () => (selected.size ? [...selected].map((id) => records.get(id)) : newRows());
            const dateField = (field, label) => h("label", {}, label, h("input", {
                type: "date", value: selected.size ? "" : defaultDates[field], "aria-label": `${label} for ${selected.size ? "selected" : "all"} items`,
                onchange: (e) => {
                    const value = e.target.value;
                    if (!selected.size) defaultDates[field] = value;
                    targets().forEach((rec) => { rec[field] = value; markDirty(rec, [field]); });
                    render();
                },
            }));
            const datesBar = h("div", { class: "dates-bar" },
                h("span", {}, selected.size ? `Set for ${selected.size} selected:` : "Set for all items:"),
                dateField("mfgStartDate", "Mfg start date"),
                dateField("dispatchDate", "Dispatch date"));
            const body = list.length ? list.map(renderNewRow)
                : [h("div", { class: "empty-note" }, projects.length ? "No new items. Use Add row to add one." : "This PO has no projects yet, so nothing can be published.")];
            return h("div", {}, head, datesBar, columnHeader(true), ...body,
                h("div", { class: "add-row-line" }, h("button", { onclick: addRow }, "+ Add row")));
        }

        function parentButton(rec, onOpen) {
            const grouped = rec.partOfGroup && rec.groupName;
            return h("button", {
                class: `select${grouped ? "" : " placeholder"}`, "aria-haspopup": "menu", "aria-expanded": "false",
                onclick: (e) => onOpen(e.currentTarget),
            },
                grouped ? h("span", { class: "dot-g", style: `background:${groupColor(rec.groupName)}` }) : "",
                h("span", { class: "label" }, grouped ? rec.groupName : "Standalone"),
                icon("chevron", 14, "chev"));
        }

        function rowTint(groupName) {
            return groupName ? `background:${tint(groupColor(groupName))}` : "";
        }

        function inputCell(rec, field, opts = {}) {
            const tag = opts.multiline ? "textarea" : "input";
            const el = h(tag, {
                class: `in${opts.mono ? " mono" : ""}${opts.numeric ? " num" : ""}`,
                value: rec[field] == null ? "" : String(rec[field]),
                placeholder: opts.placeholder || "",
                inputmode: opts.numeric ? "decimal" : null,
                rows: opts.multiline ? 1 : null,
                "aria-label": opts.label,
                "data-focus": `${rec._localId}:${field}`,
                oninput: (e) => {
                    let value = e.target.value;
                    if (opts.numeric) value = value.trim() === "" ? null : (isNaN(Number(value)) ? rec[field] : Number(value));
                    rec[field] = value;
                    if (opts.multiline) autoGrow(e.target);
                    markDirty(rec, rec.rowId ? [field] : [field, ...NEW_ROW_FIELDS]);
                    refreshChrome();
                },
                onchange: () => { if (field === "partNumber") render(); },
                onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); moveDown(e.target, field); } },
            });
            return h("span", { class: "cell", "data-check": `row|${rec._localId}|${field}` }, el);
        }

        function renderNewRow(rec) {
            const grouped = rec.partOfGroup && rec.groupName;
            return h("div", { class: `grid row${selected.has(rec._localId) ? " selected" : ""}`, style: grouped ? rowTint(rec.groupName) : "" },
                h("span", { class: "cell center" }, h("input", {
                    type: "checkbox", "aria-label": "Select row", checked: selected.has(rec._localId),
                    onchange: (e) => { e.target.checked ? selected.add(rec._localId) : selected.delete(rec._localId); render(); },
                })),
                h("span", { class: "cell pad" }, parentButton(rec, (btn) => openParentMenu(btn, [rec]))),
                inputCell(rec, "partNumber", { mono: true, placeholder: "Required", label: "Assembly number" }),
                inputCell(rec, "partName", { multiline: true, label: "Assembly name" }),
                inputCell(rec, "quantity", { numeric: true, placeholder: "Required", label: "Quantity" }),
                h("span", { class: "cell pad", "data-check": `row|${rec._localId}|project` }, h("button", {
                    class: `select${rec.project ? "" : " placeholder"}`, "aria-haspopup": "menu", "aria-expanded": "false",
                    onclick: (e) => openProjectMenu(e.currentTarget, [rec]),
                }, h("span", { class: "label" }, rec.project || "Select"), icon("chevron", 14, "chev"))),
                h("span", { class: "cell pad" }, h("button", {
                    class: "select", "aria-haspopup": "menu", "aria-expanded": "false",
                    onclick: (e) => openStatusMenu(e.currentTarget, [rec]),
                }, h("span", { class: "label" }, rec.currentStatus || statuses[0]), icon("chevron", 14, "chev"))),
                dateCell(rec, "mfgStartDate", "Mfg start date"),
                dateCell(rec, "dispatchDate", "Dispatch date"),
                h("span", { class: "cell center" }, h("button", { class: "icon-btn", "aria-label": "Remove row", title: "Remove row", onclick: () => removeRows([rec]) }, icon("trash", 15))),
            );
        }

        function dateCell(rec, field, label) {
            return h("span", { class: "cell", "data-check": `row|${rec._localId}|${field}` }, h("input", {
                type: "date", class: "in date", value: rec[field] || "", "aria-label": label, "data-focus": `${rec._localId}:${field}`,
                onchange: (e) => { rec[field] = e.target.value; markDirty(rec, rec.rowId ? [field] : [field, ...NEW_ROW_FIELDS]); refreshChrome(); },
            }));
        }

        // Status and dates belong to new assemblies; existing rows leave those columns empty
        const emptyCells = () => [h("span", { class: "cell" }), h("span", { class: "cell" }), h("span", { class: "cell" })];

        function renderExistingSections() {
            const byProject = new Map(projects.map((p) => [lower(p), { name: p, items: [] }]));
            for (const item of existing) {
                const bucket = byProject.get(lower(item.project));
                if (bucket) bucket.items.push(item);
            }
            const matched = new Map(matchedRows().map((r) => [matchOf(r).key, r]));
            const sections = [];
            for (const { name, items } of byProject.values()) {
                if (!items.length) continue;
                sections.push(h("div", { class: "section-head existing-head" },
                    h("span", { class: "name" }, `Already in ${name}`),
                    h("span", { class: "count" }, String(items.length)),
                    h("span", { class: "note" }, "· Assembly number and project are locked")));
                sections.push(columnHeader(false));
                for (const item of items) sections.push(matched.has(item.key) ? renderMatchedRow(item, matched.get(item.key)) : renderExistingRow(item));
            }
            return sections;
        }

        function lockedParent(item) {
            return h("button", { class: "select", disabled: true, title: "Change the parent from the assembly page" },
                item.parent ? h("span", { class: "dot-g", style: `background:${groupColor(item.parent)}` }) : "",
                h("span", { class: "label" }, item.parent || "Standalone"), icon("chevron", 14, "chev"));
        }

        function renderExistingRow(item) {
            const edit = existingEdits[item.key] || {};
            const removed = !!edit.remove;
            const qty = edit.quantity != null ? edit.quantity : item.quantity;
            const name = edit.partName != null ? edit.partName : item.partName;
            const focusId = `ex-${item.key}`;
            return h("div", { class: `grid row${removed ? " removed" : ""}`, style: item.parent && !removed ? rowTint(item.parent) : "" },
                h("span", { class: "cell" }),
                h("span", { class: "cell pad" }, lockedParent(item)),
                h("span", { class: "cell text mono muted strike" }, item.partNumber),
                h("span", { class: "cell" }, h("textarea", {
                    class: "in strike", rows: 1, value: name, disabled: removed, "aria-label": "Assembly name", "data-focus": `${focusId}:name`,
                    oninput: (e) => { autoGrow(e.target); editExisting(item.key, { partName: e.target.value }); refreshChrome(); },
                })),
                h("span", { class: "cell", "data-check": `ex|${item.key}|quantity` }, h("span", { class: "qty-wrap" },
                    h("input", {
                        class: "in num strike", value: qty == null ? "" : String(qty), inputmode: "decimal", disabled: removed,
                        "aria-label": "Quantity", "data-focus": `${focusId}:qty`,
                        oninput: (e) => { editExisting(item.key, { quantity: e.target.value.trim() === "" ? 0 : Number(e.target.value) }); refreshChrome(); },
                        onchange: () => render(),
                    }),
                    edit.quantity != null && item.quantity != null ? h("span", { class: "was" }, `was ${item.quantity}`) : "")),
                h("span", { class: "cell text muted" }, item.project),
                ...emptyCells(),
                h("span", { class: "cell center" }, removed
                    ? h("button", { class: "undo", onclick: () => { editExisting(item.key, { remove: false }); render(); } }, "Undo")
                    : h("button", { class: "icon-btn", "aria-label": `Remove ${item.partNumber} from ${item.project}`, title: "Remove from project", onclick: () => { editExisting(item.key, { remove: true }); render(); } }, icon("trash", 15))),
            );
        }

        // A PO line item whose assembly already exists in its project: publishing updates that assembly's qty
        function renderMatchedRow(item, rec) {
            return h("div", { class: "grid row", style: item.parent ? rowTint(item.parent) : "" },
                h("span", { class: "cell" }),
                h("span", { class: "cell pad" }, lockedParent(item)),
                h("span", { class: "cell text mono muted" }, item.partNumber),
                h("span", { class: "cell text", style: "color:var(--text-2)" }, item.partName || rec.partName),
                h("span", { class: "cell", "data-check": `row|${rec._localId}|quantity` }, h("span", { class: "qty-wrap" },
                    h("input", {
                        class: "in num", value: rec.quantity == null ? "" : String(rec.quantity), inputmode: "decimal", placeholder: "Required",
                        "aria-label": "Quantity from this PO", "data-focus": `${rec._localId}:quantity`,
                        oninput: (e) => {
                            const v = e.target.value.trim();
                            rec.quantity = v === "" ? null : (isNaN(Number(v)) ? rec.quantity : Number(v));
                            markDirty(rec, ["quantity"]);
                            refreshChrome();
                        },
                        onchange: () => render(),
                    }),
                    rec.quantity !== item.quantity && item.quantity != null ? h("span", { class: "was" }, `was ${item.quantity}`) : "")),
                h("span", { class: "cell text muted" }, item.project),
                ...emptyCells(),
                h("span", { class: "cell center" }, h("button", { class: "icon-btn", "aria-label": "Remove this PO line", title: "Remove this PO line", onclick: () => removeRows([rec]) }, icon("trash", 15))),
            );
        }

        function autoGrow(el) {
            el.style.height = "auto";
            el.style.height = `${Math.max(50, el.scrollHeight)}px`;
        }

        function moveDown(el, field) {
            const all = [...document.querySelectorAll(`[data-focus$=":${field}"]`)];
            const next = all[all.indexOf(el) + 1];
            if (next) next.focus(); else el.blur();
        }

        // ---------- Row actions ----------

        function addRow() {
            const rec = newRecord();
            rows.push(rec);
            selected.clear();
            render();
            document.querySelector(`[data-focus="${rec._localId}:partNumber"]`)?.focus();
        }

        function removeRows(list) {
            list = list.filter(Boolean);
            const removed = list.map((rec) => ({ rec, index: rows.indexOf(rec) }));
            for (const rec of list) {
                rows = rows.filter((r) => r !== rec);
                selected.delete(rec._localId);
                rec.rejected = true;
                markDirty(rec, ["rejected"]);
            }
            render();
            const named = removed.filter(({ rec }) => !isBlank(rec)).length;
            if (named) {
                toast(`${named} row${named === 1 ? "" : "s"} removed`, "Undo", () => {
                    for (const { rec, index } of removed.sort((a, b) => a.index - b.index)) {
                        rec.rejected = false;
                        register(rec);
                        markDirty(rec, ["rejected"]);
                        rows.splice(Math.min(index, rows.length), 0, rec);
                    }
                    render();
                });
            }
        }

        // ---------- Menus ----------

        let menuAnchor = null;

        function openMenu(anchor, build) {
            closeMenu();
            const menu = $("menu");
            menu.replaceChildren(...build());
            menu.hidden = false;
            menuAnchor = anchor;
            anchor.setAttribute("aria-expanded", "true");
            const r = anchor.getBoundingClientRect();
            menu.style.minWidth = `${Math.max(220, r.width)}px`;
            const below = window.innerHeight - r.bottom;
            const height = Math.min(menu.scrollHeight, 360);
            menu.style.left = `${Math.min(r.left, window.innerWidth - menu.offsetWidth - 8)}px`;
            menu.style.top = below < height + 12 && r.top > height + 12 ? `${r.top - height - 4}px` : `${r.bottom + 4}px`;
            (menu.querySelector("[aria-checked='true']") || menu.querySelector(".opt"))?.focus();
        }

        function closeMenu() {
            $("menu").hidden = true;
            if (menuAnchor) { menuAnchor.setAttribute("aria-expanded", "false"); menuAnchor = null; }
        }

        document.addEventListener("mousedown", (e) => {
            if (!$("menu").hidden && !$("menu").contains(e.target) && e.target !== menuAnchor && !menuAnchor?.contains(e.target)) closeMenu();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !$("menu").hidden) { const a = menuAnchor; closeMenu(); a?.focus(); }
        });
        window.addEventListener("resize", closeMenu);
        $("table-scroll").addEventListener("scroll", closeMenu);
        $("menu").addEventListener("keydown", (e) => {
            if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
            const opts = [...$("menu").querySelectorAll(".opt")];
            const i = opts.indexOf(document.activeElement);
            opts[(i + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length]?.focus();
            e.preventDefault();
        });

        function option(label, checked, onPick, extra = {}) {
            return h("button", { class: "opt", role: "menuitemradio", "aria-checked": checked ? "true" : "false", onclick: onPick },
                extra.color ? h("span", { class: "dot-g", style: `background:${extra.color}` }) : "",
                h("span", { class: "label" }, label),
                extra.meta ? h("span", { class: "meta" }, extra.meta) : "",
                h("span", { class: "check" }, checked ? icon("check", 15) : ""));
        }

        function openParentMenu(anchor, targets) {
            const current = targets.length === 1 ? (targets[0].partOfGroup ? lower(targets[0].groupName) : "") : null;
            const pick = (name) => () => {
                targets.forEach((rec) => setParent(rec, name));
                closeMenu();
                render();
            };
            const counts = new Map();
            rows.forEach((r) => { if (r.partOfGroup && r.groupName) counts.set(lower(r.groupName), (counts.get(lower(r.groupName)) || 0) + 1); });
            openMenu(anchor, () => {
                const items = [option("Standalone", current === "", pick(""))];
                if (groups.length) {
                    items.push(h("div", { class: "divider" }));
                    for (const g of groups) {
                        const meta = g.existing ? `in ${g.project}` : String(counts.get(lower(g.name)) || 0);
                        items.push(option(g.name, current === lower(g.name), pick(g.name), { color: groupColor(g.name), meta }));
                    }
                }
                items.push(h("div", { class: "divider" }));
                const create = h("button", { class: "opt", role: "menuitem" }, icon("plus", 15), h("span", { class: "label" }, "Create new parent assembly"));
                create.addEventListener("click", () => {
                    const input = h("input", { placeholder: "Name of the parent assembly", "aria-label": "New parent assembly name" });
                    const submit = () => {
                        const name = input.value.trim();
                        if (!name) { input.focus(); return; }
                        pick(name)();
                    };
                    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
                    create.replaceWith(h("div", { class: "create" }, input, h("button", { onclick: submit }, "Add")));
                    input.focus();
                });
                items.push(create);
                return items;
            });
        }

        function openStatusMenu(anchor, targets) {
            const current = targets.length === 1 ? (targets[0].currentStatus || statuses[0]) : null;
            openMenu(anchor, () => statuses.map((st) => option(st, current === st, () => {
                targets.forEach((rec) => { rec.currentStatus = st; markDirty(rec, ["currentStatus"]); });
                closeMenu();
                render();
            })));
        }

        function openProjectMenu(anchor, targets) {
            const current = targets.length === 1 ? targets[0].project : null;
            openMenu(anchor, () => {
                if (!projects.length) return [h("div", { class: "heading" }, "No projects on this PO")];
                return [h("div", { class: "heading" }, "Projects on this PO"), ...projects.map((p) => option(p, current === p, () => {
                    targets.forEach((rec) => { rec.project = p; markDirty(rec, ["project"]); });
                    closeMenu();
                    render();
                }))];
            });
        }

        // ---------- Toast ----------

        let toastTimer = null;
        function toast(text, actionLabel, action, kind = "") {
            const el = $("toast");
            el.className = `toast show ${kind}`;
            $("toast-text").textContent = text;
            const btn = $("toast-action");
            btn.hidden = !actionLabel;
            btn.textContent = actionLabel || "";
            btn.onclick = () => { el.className = "toast"; action?.(); };
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.className = "toast"; }, kind === "error" ? 12000 : 6000);
        }

        // ---------- Publish ----------

        function openConfirm() {
            const s = summary();
            const lines = [];
            if (s.add) lines.push(`${s.add} new assembl${s.add === 1 ? "y" : "ies"}`);
            if (s.updates) lines.push(`${s.updates} quantity update${s.updates === 1 ? "" : "s"}`);
            if (s.renames) lines.push(`${s.renames} rename${s.renames === 1 ? "" : "s"}`);
            if (s.removals) lines.push(`${s.removals} removal${s.removals === 1 ? "" : "s"}`);
            $("confirm-list").replaceChildren(...lines.map((t) => h("li", {}, t)));
            $("confirm").classList.add("show");
            $("confirm-ok").focus();
        }

        async function publish() {
            $("confirm").classList.remove("show");
            busy = true;
            refreshChrome();
            try {
                if (!(await flushAll())) throw new Error("Your latest edits could not be saved. Check your connection and try again.");
                setStatus("saving", "Publishing…");
                const res = await fetch(`${API}/submit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user: USER_EMAIL,
                        existingChanges: Object.entries(existingEdits).map(([key, e]) => ({ key, ...e })),
                    }),
                });
                const body = await res.json().catch(() => ({}));
                if (!res.ok) {
                    if (body.rowErrors) showRowErrors(body.rowErrors);
                    throw new Error(body.error || `Publish failed (HTTP ${res.status})`);
                }
                existingEdits = {};
                storeEdits();
                const parts = [];
                const created = body.standaloneAssemblies + body.groupAssemblies;
                if (created) parts.push(`${created} assembl${created === 1 ? "y" : "ies"} created`);
                if (body.childParts) parts.push(`${body.childParts} child part${body.childParts === 1 ? "" : "s"} added`);
                if (body.quantityUpdates) parts.push(`${body.quantityUpdates} quantity update${body.quantityUpdates === 1 ? "" : "s"}`);
                if (body.removals) parts.push(`${body.removals} removed`);
                await load();
                const warnings = body.warnings || [];
                toast(`Published: ${parts.join(", ") || "done"}.${warnings.length ? `\n${warnings.join("\n")}` : ""}`, null, null, warnings.length ? "error" : "");
            } catch (err) {
                toast(err.message, null, null, "error");
                setStatus("saved", "Saved");
            } finally {
                busy = false;
                refreshChrome();
            }
        }

        function showRowErrors(rowErrors) {
            const byId = new Map(rowErrors.map((e) => [e.rowId, e.message]));
            document.querySelectorAll("[data-check]").forEach((cell) => {
                const [kind, id] = cell.dataset.check.split("|");
                const key = kind === "row" ? records.get(id)?.rowId : id;
                if (byId.has(key)) { cell.classList.add("invalid"); cell.title = byId.get(key); }
            });
        }

        $("publish").addEventListener("click", openConfirm);
        $("confirm-ok").addEventListener("click", publish);
        $("confirm-cancel").addEventListener("click", () => $("confirm").classList.remove("show"));
        $("save").addEventListener("click", async () => {
            storeEdits();
            const ok = await flushAll();
            toast(ok ? "All changes saved" : "Could not save – retrying", null, null, ok ? "" : "error");
        });
        $("missing").addEventListener("click", () => {
            const cell = document.querySelector("[data-check].invalid");
            if (!cell) return;
            cell.scrollIntoView({ block: "center", behavior: "smooth" });
            (cell.querySelector("input, textarea, button"))?.focus({ preventScroll: true });
        });

        // ---------- Documents ----------

        function renderDocs(po) {
            const tabs = [];
            po.attachmentIds.forEach((id, i) => tabs.push({
                label: po.attachmentIds.length === 1 ? "Attachment" : `Attachment ${i + 1}`,
                index: i,
                preview: `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`,
                open: `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`,
            }));
            if (po.emailBody) tabs.push({ label: "Email", email: po.emailBody });

            const viewer = $("viewer");
            const bar = $("doc-tabs");
            if (!tabs.length) {
                bar.replaceChildren(h("span", { class: "tab active" }, "No attachments"));
                viewer.replaceChildren(h("div", { class: "empty" }, "This PO has no attachments or email body."));
                return;
            }
            let fullEmail = false;
            const show = (index) => {
                const tab = tabs[index];
                const tools = h("span", { class: "doc-tools" });
                bar.replaceChildren(
                    ...tabs.map((t, i) => h("button", { class: `tab${i === index ? " active" : ""}`, onclick: () => show(i) }, t.label)),
                    tools,
                    tab.open ? h("a", { class: "doc-open", href: tab.open, target: "_blank", rel: "noopener" }, "Open", icon("external", 13)) : "",
                );
                if (tab.email != null) {
                    tools.append(h("button", { onclick: () => { fullEmail = !fullEmail; show(index); } }, fullEmail ? "Hide headers" : "Show full email"));
                    // Sandboxed with no scripts: the email is shown, never run
                    viewer.replaceChildren(h("iframe", {
                        sandbox: "allow-popups allow-popups-to-escape-sandbox", title: "Email",
                        srcdoc: emailDocument(tab.email, !fullEmail),
                    }));
                } else {
                    showAttachment(tab, tools);
                }
            };
            show(0);
        }

        // ---------- Email ----------

        const HEADER_LINE = /^\s*(-{2,}\s*(forwarded|original) message\s*-{2,}|(from|sent|date|to|cc|bcc|subject|reply-to)\s*:)/i;

        function isHeaderBlock(text) {
            const labels = text.match(/\b(from|sent|date|to|cc|bcc|subject)\s*:/gi) || [];
            return HEADER_LINE.test(text) && labels.length >= 2 && text.length < 1200;
        }

        function emailDocument(raw, hideHeaders) {
            const isHtml = /<(html|body|div|p|br|table|span|font|b|strong|ul|ol|li)\b[^>]*>/i.test(raw);
            let content;
            if (isHtml) {
                const doc = new DOMParser().parseFromString(raw, "text/html");
                doc.querySelectorAll("script, style, link, meta, title, base").forEach((el) => el.remove());
                if (hideHeaders) {
                    // Forwarded/reply header blocks (Gmail's "---- Forwarded message ----", Outlook's From/Sent/To)
                    for (const el of doc.body.querySelectorAll("div, p, td, blockquote, span")) {
                        if (el.isConnected && isHeaderBlock(el.textContent.trim())) el.remove();
                    }
                }
                content = doc.body.innerHTML;
            } else {
                let lines = raw.replace(/\r\n?/g, "\n").split("\n");
                if (hideHeaders) lines = lines.filter((line) => !HEADER_LINE.test(line));
                const text = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
                content = `<div style="white-space:pre-wrap">${text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</div>`;
            }
            return `<!doctype html><meta charset="utf-8"><base target="_blank"><style>
                body{margin:20px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#1f1f23;background:#fff;word-wrap:break-word}
                table{border-collapse:collapse;max-width:100%}td,th{padding:2px 6px;vertical-align:top}
                img{max-width:100%;height:auto}blockquote{margin:8px 0;padding-left:12px;border-left:2px solid #ddd;color:#555}
                p{margin:0 0 10px}</style><body>${content}</body>`;
        }

        // ---------- Attachments: rendered here so they can be zoomed and copied from ----------

        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }
        const attachmentCache = new Map(); // index -> Promise<{ type, pdf?, url? }>

        function loadAttachment(index) {
            if (!attachmentCache.has(index)) {
                attachmentCache.set(index, (async () => {
                    const res = await fetch(`${API}/attachments/${index}`);
                    if (!res.ok) {
                        const body = await res.json().catch(() => ({}));
                        throw new Error(body.error || `HTTP ${res.status}`);
                    }
                    const data = await res.arrayBuffer();
                    const type = sniffType(new Uint8Array(data, 0, Math.min(1024, data.byteLength)),
                        (res.headers.get("content-type") || "").split(";")[0]);
                    if (type === "application/pdf" && window.pdfjsLib) {
                        return { type: "pdf", pdf: await pdfjsLib.getDocument({ data }).promise };
                    }
                    if (type.startsWith("image/")) return { type: "image", url: URL.createObjectURL(new Blob([data], { type })) };
                    throw new Error(`Can't show ${type || "this file"} here`);
                })());
                attachmentCache.get(index).catch(() => attachmentCache.delete(index));
            }
            return attachmentCache.get(index);
        }

        // Drive often labels files application/octet-stream, so look at the file's own first bytes
        function sniffType(head, declared) {
            const starts = (...bytes) => bytes.every((b, i) => head[i] === b);
            if (new TextDecoder("latin1").decode(head).includes("%PDF")) return "application/pdf";
            if (starts(0x89, 0x50, 0x4e, 0x47)) return "image/png";
            if (starts(0xff, 0xd8, 0xff)) return "image/jpeg";
            if (starts(0x47, 0x49, 0x46, 0x38)) return "image/gif";
            if (starts(0x52, 0x49, 0x46, 0x46) && head[8] === 0x57 && head[9] === 0x45) return "image/webp";
            return declared;
        }

        let viewToken = 0;

        async function showAttachment(tab, tools) {
            const token = ++viewToken;
            const viewer = $("viewer");
            viewer.replaceChildren(h("div", { class: "empty" }, "Loading attachment…"));
            let file;
            try {
                file = await loadAttachment(tab.index);
            } catch (err) {
                if (token !== viewToken) return;
                // Fall back to Google's own viewer (no zoom or copy from here)
                viewer.replaceChildren(h("iframe", { src: tab.preview, title: tab.label }),
                    h("div", { class: "doc-note" }, `Showing Google's viewer: ${err.message}`));
                return;
            }
            if (token !== viewToken) return;

            const scroll = h("div", { class: "pdf-scroll" });
            const pages = h("div", { class: "pdf-pages" });
            scroll.append(pages);
            viewer.replaceChildren(scroll);

            // zoom = 1 fits the page width to the pane
            let zoom = 1, rendered = 0, fitWidth = 0, renderTimer = null;
            const pct = h("button", { class: "pct", title: "Fit to width", onclick: () => setZoom(1) }, "100%");
            tools.append(
                h("button", { "aria-label": "Zoom out", title: "Zoom out", onclick: () => setZoom(zoom / 1.25) }, "−"),
                pct,
                h("button", { "aria-label": "Zoom in", title: "Zoom in", onclick: () => setZoom(zoom * 1.25) }, "+"),
            );

            const paneWidth = () => Math.max(200, scroll.clientWidth - 32);

            async function draw() {
                const width = paneWidth() * zoom;
                pages.style.zoom = "";
                if (file.type === "image") {
                    pages.replaceChildren(h("div", { class: "pdf-page" }, h("img", { src: file.url, alt: tab.label, style: `width:${width}px` })));
                } else {
                    const out = [];
                    for (let n = 1; n <= file.pdf.numPages; n++) {
                        const page = await file.pdf.getPage(n);
                        const base = page.getViewport({ scale: 1 });
                        const viewport = page.getViewport({ scale: width / base.width });
                        const ratio = window.devicePixelRatio || 1;
                        const canvas = h("canvas", { width: Math.floor(viewport.width * ratio), height: Math.floor(viewport.height * ratio) });
                        canvas.style.width = `${viewport.width}px`;
                        canvas.style.height = `${viewport.height}px`;
                        const text = h("div", { class: "textLayer" });
                        text.style.setProperty("--scale-factor", viewport.scale);
                        const wrap = h("div", { class: "pdf-page", style: `width:${viewport.width}px;height:${viewport.height}px` }, canvas, text);
                        out.push(wrap);
                        await page.render({ canvasContext: canvas.getContext("2d"), viewport, transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null }).promise;
                        pdfjsLib.renderTextLayer({ textContentSource: await page.getTextContent(), container: text, viewport, textDivs: [] });
                    }
                    pages.replaceChildren(...out);
                }
                rendered = zoom;
                fitWidth = paneWidth();
            }

            // Zoom around a point (the pinch centre or the pane centre), showing the change at once with
            // CSS zoom and re-rendering sharply once the gesture settles
            function setZoom(next, cx = scroll.clientWidth / 2, cy = scroll.clientHeight / 2) {
                if (!rendered) return;
                next = Math.min(6, Math.max(0.3, next));
                const x = scroll.scrollLeft + cx, y = scroll.scrollTop + cy;
                const factor = next / zoom;
                zoom = next;
                pct.textContent = `${Math.round(zoom * 100)}%`;
                pages.style.zoom = String(zoom / rendered);
                scroll.scrollLeft = x * factor - cx;
                scroll.scrollTop = y * factor - cy;
                clearTimeout(renderTimer);
                renderTimer = setTimeout(async () => {
                    const left = scroll.scrollLeft, top = scroll.scrollTop;
                    await draw();
                    scroll.scrollLeft = left;
                    scroll.scrollTop = top;
                }, 180);
            }

            // Trackpad pinch (Chrome, Edge, Firefox send it as ctrl + wheel), and Ctrl/Cmd + scroll
            scroll.addEventListener("wheel", (e) => {
                if (!e.ctrlKey && !e.metaKey) return;
                e.preventDefault();
                const r = scroll.getBoundingClientRect();
                // Trackpads send small steps, a mouse wheel big ones: cap each step at about 25%
                const step = Math.max(-25, Math.min(25, e.deltaY));
                setZoom(zoom * Math.exp(-step * 0.01), e.clientX - r.left, e.clientY - r.top);
            }, { passive: false });
            // Safari trackpad pinch
            let gestureStart = 1;
            scroll.addEventListener("gesturestart", (e) => { e.preventDefault(); gestureStart = zoom; });
            scroll.addEventListener("gesturechange", (e) => {
                e.preventDefault();
                const r = scroll.getBoundingClientRect();
                setZoom(gestureStart * e.scale, e.clientX - r.left, e.clientY - r.top);
            });
            // Touch screens: two-finger pinch
            let pinch = null;
            const spread = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
            scroll.addEventListener("touchstart", (e) => { if (e.touches.length === 2) pinch = { d: spread(e.touches), z: zoom }; }, { passive: true });
            scroll.addEventListener("touchmove", (e) => {
                if (!pinch || e.touches.length !== 2) return;
                e.preventDefault();
                const r = scroll.getBoundingClientRect();
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
                setZoom(pinch.z * spread(e.touches) / pinch.d, cx, cy);
            }, { passive: false });
            scroll.addEventListener("touchend", () => { pinch = null; });

            // Re-fit when the pane is resized (splitter, window)
            new ResizeObserver(() => {
                if (token === viewToken && rendered && Math.abs(paneWidth() - fitWidth) > 4) setZoom(zoom);
            }).observe(scroll);

            await draw();
        }

        // ---------- Splitter (width lasts until reload) ----------

        (function splitter() {
            const handle = $("splitter");
            const doc = document.querySelector(".doc");
            const total = () => document.querySelector("main").clientWidth - 48 - handle.offsetWidth;
            const setWidth = (px) => {
                const width = Math.min(Math.max(px, 260), total() - 420);
                doc.style.flex = `0 0 ${width}px`;
            };
            let startX = 0, startWidth = 0;
            handle.addEventListener("pointerdown", (e) => {
                startX = e.clientX;
                startWidth = doc.getBoundingClientRect().width;
                handle.setPointerCapture(e.pointerId);
                document.body.classList.add("resizing");
            });
            handle.addEventListener("pointermove", (e) => {
                if (handle.hasPointerCapture(e.pointerId)) setWidth(startWidth + e.clientX - startX);
            });
            const stop = (e) => { if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId); document.body.classList.remove("resizing"); };
            handle.addEventListener("pointerup", stop);
            handle.addEventListener("pointercancel", stop);
            handle.addEventListener("dblclick", () => { doc.style.flex = ""; });
            handle.addEventListener("keydown", (e) => {
                if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
                setWidth(doc.getBoundingClientRect().width + (e.key === "ArrowLeft" ? -32 : 32));
                e.preventDefault();
            });
        })();

        // ---------- Loading ----------

        async function load() {
            const res = await fetch(API);
            const body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(body.error || `Could not load line items (HTTP ${res.status})`);

            projects = body.projects;
            statuses = body.statuses || statuses;
            groups = body.groups.map((g) => ({ name: g.name, partNumber: g.partNumber, existing: g.existing, project: g.project }));
            existing = body.existing || [];
            loadEdits();
            // Drop edits for assemblies that are gone
            for (const key of Object.keys(existingEdits)) if (!existing.some((e) => e.key === key)) delete existingEdits[key];
            storeEdits();

            records.clear();
            selected.clear();
            rows = [];
            for (const r of body.rows) {
                const rec = register({ ...r });
                if (!rec.mfgStartDate) {
                    rec.mfgStartDate = tomorrow();
                    markDirty(rec, ["mfgStartDate"]);
                }
                // With one project on the PO there is nothing to choose, so fill it in
                if (!rec.project && projects.length === 1) {
                    rec.project = projects[0];
                    markDirty(rec, ["project"]);
                }
                rows.push(rec);
            }
            // "Set for all items" starts from the date every row already shares, if they do
            for (const field of ["mfgStartDate", "dispatchDate"]) {
                const values = new Set(rows.map((r) => r[field] || ""));
                defaultDates[field] = values.size === 1 ? [...values][0] : (field === "mfgStartDate" ? tomorrow() : "");
            }
            if (!rows.length && !existing.length && projects.length) rows.push(newRecord());

            if (!document.querySelector("#doc-tabs .tab")) renderDocs(body.po);
            $("loading").hidden = true;
            $("table").hidden = false;
            render();
            if (hasDirty()) scheduleSave(); else setStatus("saved", "Saved");
        }

        (async function init() {
            if (!PO_ROW_ID) {
                $("loading").textContent = "Open this page from the PO in Glide (the link must include ?po=<PO row ID>).";
                $("viewer").replaceChildren(h("div", { class: "empty" }, "No PO selected."));
                setStatus("error", "No PO");
                return;
            }
            try {
                await load();
            } catch (err) {
                console.error(err);
                $("loading").textContent = `${err.message}. Reload the page to try again.`;
                $("viewer").replaceChildren(h("div", { class: "empty" }, "Could not load the PO."));
                setStatus("error", "Not loaded");
            }
        })();
    </script>
</body>

</html>
